@if (streamUrl) {
  <div class="video-player">
    <video
      #playerVideo
      class="video-player__video"
      [attr.src]="streamHls ? null : streamUrl"
      controls></video>
  </div>

  @if (temLegendas) {
    <div class="video-player--legendas">
      <label for="legenda-select">Legenda</label>
      <select
        id="legenda-select"
        [value]="indiceSelecionado"
        (change)="alterarLegenda(+$any($event.target).value)">
        <option [value]="-1">Desligada</option>
        @for (legenda of legendasDisponiveis; track track($index)) {
          <option [value]="legendasOrdenadas.indexOf(legenda)">
            {{ rotulo(legenda) }}
          </option>
        }
      </select>
    </div>
  }
} @else if (videoUrl) {
  @if (ehIframe) {
    <div class="video-player">
      <iframe
        class="video-player__iframe"
        [src]="videoUrl | safeUrl"
        title="Player de vídeo"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  } @else {
    <div class="video-player">
      <video class="video-player__video" [src]="videoUrl" controls></video>
    </div>
  }
} @else {
  <div class="video-player video-player--vazio">
    <i class="pi pi-video"></i>
    <p>Este episódio ainda não possui vídeo disponível.</p>
  </div>
}
