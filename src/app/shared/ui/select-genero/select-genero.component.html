<div class="select-genero">
  <p-multiselect
    [options]="(generos$ | async) ?? []"
    [ngModel]="generos"
    (ngModelChange)="aoSelecionar($event)"
    [placeholder]="placeholder"
    optionLabel="nome"
    optionValue="id"
    [maxSelectedLabels]="maxSelectedLabels"
    [showClear]="multiplos"
    appendTo="body" />
</div>
