@if (anime) {
  <article class="anime-card">
    <a class="anime-card__link" [routerLink]="rota" (click)="abrirDetalhes.emit()">
      <div class="anime-card__poster">
        <img [src]="anime.capaUrl" [alt]="anime.titulo" loading="lazy" />
        <div class="anime-card__overlay">
          <span class="anime-card__play"><i class="pi pi-play"></i></span>
        </div>
        <div class="anime-card__nota">
          <app-rating-badge [nota]="anime.nota" />
        </div>
        @if (anime.temLegendaPortugues) {
          <span
            class="anime-card__pt"
            title="Este título tem faixa de legenda em português"
            >PT</span
          >
        }
      </div>
      <div class="anime-card__corpo">
        <h3 class="anime-card__titulo">{{ anime.titulo }}</h3>
      </div>
    </a>
  </article>
}
